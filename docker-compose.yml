services:
  api-gateway:
    build:
      context: .
      dockerfile: ./packages/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./packages/api-gateway/src:/app/packages/api-gateway/src
    environment:
      - PORT=3000
      - JWT_SECRET=super-secret-key-change-me
      - AUTH_SERVICE_URL=http://auth-service:3001
      - REVIEW_SERVICE_URL=http://review-service:3002
      - NOTIFICATION_SERVICE_URL=http://notification-service:3003

  auth-service:
    build:
      context: .
      dockerfile: ./packages/auth-service/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./packages/auth-service/src:/app/packages/auth-service/src
      - ./packages/db:/app/packages/db
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mergeguard?schema=public
      - JWT_SECRET=super-secret-key-change-me
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=http://localhost:3001/auth/github/callback
      - FRONTEND_URL=http://localhost:3004

  review-service:
    build: ./packages/review-service
    ports:
      - "3002:3002"
    volumes:
      - ./packages/review-service/src:/app/src
    environment:
      - PORT=3002

  notification-service:
    build: ./packages/notification-service
    ports:
      - "3003:3003"
    volumes:
      - ./packages/notification-service/src:/app/src
    environment:
      - PORT=3003

  web-dashboard:
    build: ./packages/web-dashboard
    ports:
      - "3004:3004"
    volumes:
      - ./packages/web-dashboard/src:/app/src
      - ./tsconfig.base.json:/tsconfig.base.json

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mergeguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ai-orchestrator:
    build: ./ai-orchestrator
    ports:
      - "8000:8000"
    volumes:
      - ./ai-orchestrator/src:/app/src
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
    volumes:
      - kafka_data:/bitnami/kafka

  ai-orchestrator:
    build: ./ai-orchestrator
    ports:
      - "8000:8000"
    volumes:
      - ./ai-orchestrator/src:/app/src
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
