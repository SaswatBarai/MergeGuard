services:
  api-gateway:
    build:
      context: .
      dockerfile: ./packages/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./packages/api-gateway/src:/app/packages/api-gateway/src
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:3001
      - REVIEW_SERVICE_URL=http://review-service:3002
      - NOTIFICATION_SERVICE_URL=http://notification-service:3003

  auth-service:
    build:
      context: .
      dockerfile: ./packages/auth-service/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./packages/auth-service/src:/app/packages/auth-service/src
    environment:
      - PORT=3001
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      - db

  review-service:
    build:
      context: .
      dockerfile: ./packages/review-service/Dockerfile
    ports:
      - "3002:3002"
    volumes:
      - ./packages/review-service/src:/app/packages/review-service/src
    environment:
      - PORT=3002
      - DATABASE_URL=${DATABASE_URL}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      - kafka
      - db

  notification-service:
    build:
      context: .
      dockerfile: ./packages/notification-service/Dockerfile
    ports:
      - "3003:3003"
    volumes:
      - ./packages/notification-service/src:/app/packages/notification-service/src
    environment:
      - PORT=3003
      - DATABASE_URL=${DATABASE_URL}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
    depends_on:
      - kafka
      - db

  web-dashboard:
    build:
      context: .
      dockerfile: ./packages/web-dashboard/Dockerfile
    ports:
      - "3004:3004"
    volumes:
      - ./packages/web-dashboard/src:/app/packages/web-dashboard/src
      - ./tsconfig.base.json:/tsconfig.base.json
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - PORT=3004

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mergeguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  kafka:
    image: apache/kafka:3.9.0
    restart: always
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=controller,broker
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
    volumes:
      - kafka_data:/var/lib/kafka/data

  ai-orchestrator:
    build: ./ai-orchestrator
    ports:
      - "8000:8000"
    volumes:
      - ./ai-orchestrator/src:/app/src
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - REDIS_URL=redis://redis:6379
      - LLM_PROVIDER=${LLM_PROVIDER:-google}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    depends_on:
      - kafka
      - redis
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
  redis_data:
  kafka_data:
