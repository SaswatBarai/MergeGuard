services:
  api-gateway:
    build: ./packages/api-gateway
    ports:
      - "3000:3000"
    volumes:
      - ./packages/api-gateway/src:/app/src
    environment:
      - PORT=3000

  auth-service:
    build:
      context: .
      dockerfile: ./packages/auth-service/Dockerfile
    ports:
      - "3001:3001"
    volumes:
      - ./packages/auth-service/src:/app/packages/auth-service/src
      - ./packages/db:/app/packages/db
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/mergeguard?schema=public
      - JWT_SECRET=super-secret-key-change-me
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=http://localhost:3001/auth/github/callback
      - FRONTEND_URL=http://localhost:3004

  review-service:
    build: ./packages/review-service
    ports:
      - "3002:3002"
    volumes:
      - ./packages/review-service/src:/app/src
    environment:
      - PORT=3002

  notification-service:
    build: ./packages/notification-service
    ports:
      - "3003:3003"
    volumes:
      - ./packages/notification-service/src:/app/src
    environment:
      - PORT=3003

  web-dashboard:
    build: ./packages/web-dashboard
    ports:
      - "3004:3004"
    volumes:
      - ./packages/web-dashboard/src:/app/src
      - ./tsconfig.base.json:/tsconfig.base.json

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=mergeguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ai-orchestrator:
    build: ./ai-orchestrator
    ports:
      - "8000:8000"
    volumes:
      - ./ai-orchestrator/src:/app/src
    command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
