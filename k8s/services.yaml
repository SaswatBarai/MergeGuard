apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: mergeguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 221045608158.dkr.ecr.us-east-1.amazonaws.com/mergeguard-auth-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: mergeguard-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mergeguard-secrets
                  key: JWT_SECRET
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: mergeguard-secrets
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mergeguard-secrets
                  key: GITHUB_CLIENT_SECRET
            - name: GITHUB_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: mergeguard-secrets
                  key: GITHUB_REDIRECT_URI
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: mergeguard-secrets
                  key: FRONTEND_URL
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: mergeguard
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
---
