apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: mergeguard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: 221045608158.dkr.ecr.us-east-1.amazonaws.com/mergeguard-api-gateway:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mergeguard-secrets
                  key: JWT_SECRET
            - name: AUTH_SERVICE_URL
              value: "http://auth-service:3001"
            - name: REVIEW_SERVICE_URL
              value: "http://review-service:3002"
            - name: NOTIFICATION_SERVICE_URL
              value: "http://notification-service:3003"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: mergeguard
spec:
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
